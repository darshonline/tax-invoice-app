  /* =================================================================

  .locked tr.empty-row, .container tr.empty-row, .locked .info-row.empty-row, .locked .info-box.empty-box { display: none !important; }

  .container [data-en]::after {
    content: attr(data-en); display: block; font-size: .74em; font-weight: normal; opacity: .72; letter-spacing: .02em;
    direction: ltr; unicode-bidi: isolate; text-align: right; line-height: 1.25; font-style: normal; text-transform: none; }

  .lay-thermal table.items-table th[data-en]::after, .lay-thermal .totals-table td[data-en]::after { display: block; margin: 0; }

  /* الترويسة */

  .lay-minimal.locked .doc-box .r-number, .lay-minimal.locked .doc-box .r-issued, .lay-minimal.locked .doc-box .r-supply, .lay-minimal.locked .doc-box .r-payment, .lay-minimal.locked .doc-box .r-due,
  .lay-corporate.locked .doc-box .r-number, .lay-corporate.locked .doc-box .r-issued, .lay-corporate.locked .doc-box .r-supply, .lay-corporate.locked .doc-box .r-payment, .lay-corporate.locked .doc-box .r-due { display: none; }

  .lay-corporate.locked .cust-box > .addr-row, .lay-corporate.locked .cust-box > .addr-h { grid-column: 2; }

     ================================================================= */
  .lay-classic { font-family: Tahoma, Arial, sans-serif; border: 3px double var(--ink); outline: 1px solid var(--ink); outline-offset: -10px; padding: 30px 32px; border-radius: 0; }

  .lay-thermal .footer-bottom { margin-top: 6px; border-top: 1px dashed #000; font-size: 9.5px; color: #000; padding-top: 4px; }
  .lay-thermal .footer-note { color: #000; font-size: 10px; }
  .lay-thermal .integrity { font-size: 7.5px; }
  .lay-thermal .watermark span { font-size: 28px; }

  /* =================================================================
     الشاشات الصغيرة (الهاتف وما دون 700px) — للعرض فقط؛ الطباعة تبقى A4 كاملة
     ================================================================= */
  @media screen and (max-width: 700px) {
    .container:not(.lay-thermal) { padding: 16px 14px; }
    .lay-classic { outline-offset: -6px; padding: 20px 16px; }
    .lay-elegant { padding: 26px 18px; }
    .lay-minimal { padding: 22px 16px; }
    .lay-compact { padding: 10px; }
    .watermark span { font-size: 34px; padding: 6px 16px; }

    /* الترويسة: الشعار ثم العربي ثم الإنجليزي، متمركزة */
    .header-top { flex-direction: column; align-items: center; text-align: center; gap: 6px; }
    .company-ar, .company-en { text-align: center; flex: none; width: 100%; }
    .co-logo { order: -1; max-height: 54px; }
    .co-name { font-size: 16px; } .company-en .co-name { font-size: 13.5px; }
    .seller-ids { gap: 2px 14px; font-size: 10.5px; }
    .lay-classic .invoice-title-box, .lay-compact .invoice-title-box { width: auto; }
    .lay-elegant .invoice-title-box { column-gap: 10px; }
    .lay-minimal .invoice-title-box h2 { font-size: 32px; }

    /* المربعات فوق بعضها */
    .grid-info { flex-direction: column; gap: 12px; }
    .grid-info > .info-box { width: 100%; }
    .lay-elegant .info-box + .info-box { border-inline-start: 0; border-top: 1px solid var(--tint); padding-top: 10px; }
    .info-row label { width: 112px; }
    .lay-compact .info-row label { width: 104px; }
    .lay-compact.locked .cust-box:not(.empty-box) { grid-template-columns: 1fr; }
    .lay-compact.locked .cust-box > * { grid-column: 1 !important; border-inline-start: 0 !important; }
    .lay-modern.locked .cust-box:not(.empty-box), .lay-minimal.locked .cust-box:not(.empty-box), .lay-corporate.locked .cust-box:not(.empty-box) { grid-template-columns: 1fr; }
    .lay-modern.locked .cust-box > *, .lay-minimal.locked .cust-box > *, .lay-corporate.locked .cust-box > * { grid-column: 1 !important; }

    /* البطاقة العلوية */
    .lay-modern .hero, .lay-minimal .hero { flex-direction: column; align-items: stretch; gap: 12px; }
    .lay-modern .hero-meta, .lay-minimal .hero-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
    .lay-modern .hero-due, .lay-minimal .hero-due { text-align: start; border-top: 1px solid #edf2f7; padding-top: 10px; }
    .lay-modern .hero-due [data-en]::after, .lay-minimal .hero-due [data-en]::after { text-align: right; }
    .lay-modern .hero-total, .lay-minimal .hero-total { font-size: 24px; }
    .lay-modern { padding: 0 14px; }
    .lay-modern .header-top, .lay-modern .seller-ids, .lay-modern .footer-bottom { margin-left: -14px; margin-right: -14px; padding-left: 14px; padding-right: 14px; }
    .lay-modern .seller-ids { justify-content: center; }

    /* المؤسسي: العمود الجانبي يصبح أشرطة علوية */
    .lay-corporate { background: #fff; min-height: 0; }
    .lay-corporate .header-top, .lay-corporate .seller-ids, .lay-corporate .hero { float: none; width: auto; background: var(--ink); margin: 0 -14px; padding: 14px; }
    .lay-corporate .header-top { padding-top: 18px; align-items: center; } .lay-corporate .company-ar, .lay-corporate .company-en { text-align: center; }
    .lay-corporate .co-logo { align-self: center; }
    .lay-corporate .seller-ids { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; border-top: 1px solid rgba(255,255,255,.15); }
    .lay-corporate .hero { margin-bottom: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; border-top: 1px solid rgba(255,255,255,.15); }
    .lay-corporate .hero-meta { display: contents; }
    .lay-corporate .hero-due { grid-column: 1 / -1; }
    .lay-corporate > :not(.header-top):not(.seller-ids):not(.hero):not(.watermark) { margin-right: 0; }
    .lay-corporate > table.items-table { width: 100%; }
    .lay-corporate .qr-container { position: static; margin: 0 auto; width: auto; }

    /* جدول البنود في المستند الصادر: الأعمدة الأساسية فقط */
    .locked table.items-table { font-size: 11.5px; }
    .locked table.items-table th, .locked table.items-table td { padding: 5px 3px; }
    .locked table.items-table tr > :nth-child(1), .locked table.items-table tr > :nth-child(5),
    .locked table.items-table tr > :nth-child(6), .locked table.items-table tr > :nth-child(7) { display: none; }
    .locked table.items-table th[data-en]::after { font-size: .68em; }

    /* الإجماليات بعرض الشاشة، ثم التوقيعات، ثم رمز QR */
    .summary-section { flex-direction: column; align-items: stretch; gap: 14px; }
    .totals-col { width: 100% !important; margin: 0 !important; order: 1; }
    .sign-block { order: 2; }
    .qr-container { order: 3; align-self: center; }
    .lay-classic .sign-block { min-height: 80px; }
    .lay-corporate .sign-block, .lay-elegant .sign-block { flex-direction: row; gap: 14px; padding-top: 34px; }
  }

  /* إدخال البنود على الهاتف: كل بند بطاقة بحقول واضحة (المسودة فقط) */
  @media screen and (max-width: 700px) {
    .container:not(.locked) #items-table, .container:not(.locked) #items-body { display: block; width: 100%; }
    .container:not(.locked) #items-table thead { display: none; }
    .container:not(.locked) #items-body tr { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; position: relative;
      border: 1px solid #cbd5e0; border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fff; }
    .container:not(.locked) #items-body td { display: block; border: 0 !important; padding: 0 !important; text-align: right; background: none !important; min-width: 0; }
    .container:not(.locked) #items-body td[data-label]::before { content: attr(data-label); display: block; font-size: 11px; color: #718096; margin-bottom: 3px; font-weight: bold; }
    .container:not(.locked) #items-body td:nth-child(1) { display: none; }
    .container:not(.locked) #items-body td:nth-child(2) { grid-column: 1 / -1; padding-inline-end: 34px !important; }
    .container:not(.locked) #items-body td:nth-child(9) { grid-column: 1 / -1; font-size: 15px; font-weight: bold; border-top: 1px dashed #cbd5e0 !important; padding-top: 8px !important; }
    .container:not(.locked) #items-body td:nth-child(10) { position: absolute; top: 10px; left: 10px; }
    .container:not(.locked) #items-body td:nth-child(10)::before { content: none !important; }
    .container:not(.locked) #items-body td.num { direction: rtl; font-weight: bold; color: #1a202c; }
    .container:not(.locked) #items-body td input, .container:not(.locked) #items-body td textarea { border: 1px solid #cbd5e0 !important; border-radius: 6px; background: #fff; text-align: right; font-size: 14px; padding: 7px 8px; min-height: 38px; }
    .container:not(.locked) #items-body .cat-row { margin-top: 6px; }
    .container:not(.locked) #items-body .cat-row select, .container:not(.locked) #items-body .cat-row input { min-height: 34px; font-size: 12px; }
  }

  @media print {
    @page { size: A4; margin: 8mm; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background-color: #fff !important; padding: 0 !important; }
    .page { max-width: 100%; margin: 0; padding: 0; }
    .container { margin: 0 !important; }
    .container:not(.lay-elegant) { box-shadow: none !important; }
    .lay-elegant { box-shadow: inset 0 0 0 12px #fffdf8, inset 0 0 0 13px var(--accent), inset 0 0 0 16px #fffdf8, inset 0 0 0 17px var(--accent) !important; }
    .container.lay-thermal { width: 76mm !important; padding: 0 !important; }

    .no-print, .edit-only, .req, .topbar, #status, #errors { display: none !important; }
    .integrity { display: none !important; }   /* UUID و ICV و Hash تظهر على الشاشة فقط */
    input, textarea, select { border: none !important; background: transparent !important; outline: none !important; color: inherit !important; -webkit-text-fill-color: currentColor; box-shadow: none !important; padding: 0 !important; appearance: none; -webkit-appearance: none; }
    ::placeholder { color: transparent !important; -webkit-text-fill-color: transparent !important; }
    .info-box, .sign-block, .hero, .summary-section { break-inside: avoid; }
    tr { break-inside: avoid; }
  }

  @media (max-width: 640px) { .header-top:not(.x), .summary-section { flex-direction: column; } .grid-info { flex-direction: column; } .container { padding: 14px; } .totals-table { width: 100%; } table.items-table { font-size: 11px; } }
  @media print { .bar, .note { display: none !important; } #invoice { max-width: none; } }
</style>

/* المبلغ كتابةً (عربي/إنجليزي) — ريال سعودي وهللة */
const Tafqeet = (() => {
  const ONES = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
  const TENS = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
  const HUND = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];
  const SCALES = [null, ['ألف', 'ألفان', 'آلاف'], ['مليون', 'مليونان', 'ملايين'], ['مليار', 'ملياران', 'مليارات']];
  function below1000(n) {
    const h = Math.floor(n / 100), r = n % 100, parts = [];
    if (h) parts.push(HUND[h]);
    if (r) parts.push(r < 20 ? ONES[r] : (r % 10 ? ONES[r % 10] + ' و' + TENS[Math.floor(r / 10)] : TENS[Math.floor(r / 10)]));
    return parts.join(' و');
  }
  function ar(n) {
    if (n === 0) return 'صفر';
    const groups = []; let i = 0;
    while (n > 0) { const g = n % 1000; n = Math.floor(n / 1000);
      if (g) {
        let w;
        if (i === 0) w = below1000(g);
        else { const [one, two, pl] = SCALES[i];
          w = g === 1 ? one : g === 2 ? two : g <= 10 ? below1000(g) + ' ' + pl : below1000(g) + ' ' + one; }
        groups.unshift(w);
      }
      i++; }
    return groups.join(' و');
  }
  const E1 = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
  const E10 = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
  function en3(n) {
    const h = Math.floor(n / 100), r = n % 100, p = [];
    if (h) p.push(E1[h] + ' hundred');
    if (r) p.push(r < 20 ? E1[r] : E10[Math.floor(r / 10)] + (r % 10 ? '-' + E1[r % 10] : ''));
    return p.join(' ');
  }
  function en(n) {
    if (n === 0) return 'zero';
    const sc = ['', ' thousand', ' million', ' billion'], out = []; let i = 0;
    while (n > 0) { const g = n % 1000; if (g) out.unshift(en3(g) + sc[i]); n = Math.floor(n / 1000); i++; }
    return out.join(' ');
  }
  /* amount: نص أو رقم بمنزلتين — يُحسب بالهللات لتفادي أخطاء الكسور */
  function words(amount) {
    const h = Math.round(Math.abs(Number(String(amount).replace(/[^0-9.\-]/g, ''))) * 100);
    const sar = Math.floor(h / 100), hal = h % 100;
    const a = 'فقط ' + (sar || !hal ? ar(sar) + ' ريال سعودي' + (hal ? ' و' : '') : '') + (hal ? ar(hal) + ' هللة' : '') + ' لا غير';
    const ePart = (sar || !hal ? en(sar) + ' Saudi Riyal' + (sar === 1 ? '' : 's') + (hal ? ' and ' : '') : '') + (hal ? en(hal) + ' Halala' + (hal === 1 ? '' : 's') : '') + ' only';
    const e = ePart.replace(/^./, c => c.toUpperCase());
    return { ar: a, en: e };
  }
  return { words, ar, en };
})();

      el('td', { class: 'num', text: fmt(l.vat) + ` (${l.rate_bp / 100}%)` }), el('td', { class: 'num', text: fmt(l.total) })
    ])))]);
  const qrBox = el('div', { class: 'qr-container' });
  if (qrSrc) qrBox.appendChild(el('img', { src: qrSrc, alt: 'ZATCA QR' }));
  const tr = (k, v, cls, en) => el('tr', { class: cls || null }, [el('td', { text: k, 'data-en': en }), el('td', { text: v + ' SAR' })]);
  const tot = el('table', { class: 'totals-table' }, [tr('الإجمالي غير شامل الضريبة:', fmt(d.subtotal), '', 'Subtotal'), hasDisc ? tr('الخصم:', fmt(d.discount), '', 'Discount') : null,
    tr('الإجمالي الخاضع للضريبة:', fmt(d.taxable), '', 'Taxable amount'), tr('ضريبة القيمة المضافة:', fmt(d.vat), '', 'VAT'), tr('الإجمالي المستحق شامل الضريبة:', fmt(d.total), 'grand', 'Total due')]);
  const foot = el('div', { class: 'footer-bottom' }, [
    L.footer_note ? el('div', { class: 'footer-note', text: L.footer_note }) : null,
    el('div', { class: 'integrity', text: `UUID: ${d.uuid}${d.icv ? ' · ICV: ' + d.icv : ''}${d.zatca_status ? ' · ZATCA: ' + d.zatca_status : ''}` })]);
  const inv = $('invoice');
  inv.className = `container locked lay-${lay} doc-${d.doc_type}${simp ? '' : ' kind-standard'}${d.doc_type !== 'invoice' ? ' is-note' : ''}`;
  if (L.accent && /^#[0-9a-fA-F]{6}$/.test(L.accent)) inv.style.setProperty('--accent', L.accent);
  const kv = (ar, en, val, cls) => el('div', {}, [el('span', { 'data-en': en, text: ar }), el('b', { class: cls, text: val })]);
  const hero = el('div', { class: 'hero' }, [
    el('div', { class: 'hero-meta' }, [kv('رقم المستند', 'Invoice No.', d.number, 'hero-num ltr'), kv('تاريخ الإصدار', 'Issue date', riyadh(d.issued_at), 'hero-date'), kv('تاريخ التوريد', 'Supply date', d.supply_date, 'hero-supply'), kv('طريقة الدفع', 'Payment', pay, 'hero-pay'), d.due_date ? kv('تاريخ الاستحقاق', 'Due date', d.due_date, 'hero-due-date') : null].filter(Boolean)),
    el('div', { class: 'hero-due' }, [el('span', { 'data-en': 'Amount due', text: 'الإجمالي المستحق' }), el('b', { class: 'hero-total ltr', text: fmt(d.total) + ' SAR' })])]);
  const sign = el('div', { class: 'sign-block' }, [['الختم', 'Company stamp'], ['التوقيع المعتمد', 'Authorized signature'], ['توقيع المستلم', 'Received by']].map(([a, e]) => el('div', { 'data-en': e, text: a })));
  const totCol = el('div', { class: 'totals-col' }, [tot, el('div', { class: 'amount-words' }, [el('div', { class: 'aw-ar', text: aw.ar }), el('div', { class: 'aw-en', text: aw.en })])]);
  inv.replaceChildren(...[head, ids, branch, el('div', { class: 'invoice-title-box' }, [el('h2', { text: t[0] }), el('p', { text: t[1] })]), hero, info, items,
    el('div', { class: 'summary-section' }, [qrBox, sign, totCol]), foot].filter(Boolean));
  if (lay === 'thermal') {
    const ps = document.createElement('style'); document.head.appendChild(ps);
    const size = () => { ps.textContent = `@media print { @page { size: 80mm ${Math.max(100, Math.ceil(inv.scrollHeight * 25.4 / 96) + 8)}mm; margin: 2mm; } }`; };
    size(); window.addEventListener('beforeprint', size);
  }
  $('exp').textContent = 'الرابط صالح حتى ' + riyadh(d.expires_at);
  $('msg').hidden = true; inv.hidden = $('bar').hidden = $('note').hidden = false;
  window.dispatchEvent(new Event('beforeprint'));
}
$('btn-print').addEventListener('click', () => window.print());
load();
</script>
</body>
